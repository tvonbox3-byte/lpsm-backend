<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LPSM Launcher</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#eeeeee;
  color:#fff;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:0;
  background:#eeeeee;
  background-size:cover;
  background-position:center;
  z-index:-2;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.10);
  z-index:-1;
}

.top{
  height:95px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  padding:32px 60px 0;
}

.date{
  color:#00d6c8;
  font-size:22px;
  font-weight:bold;
}

.icons{
  display:flex;
  align-items:center;
  gap:22px;
  font-size:38px;
}

.icons span{
  cursor:pointer;
}

.logo{
  position:absolute;
  top:95px;
  left:60px;
  width:260px;
  height:60px;
  border-radius:8px;
  background:rgba(0,0,0,.70);
  display:flex;
  align-items:center;
  padding:5px 12px;
  overflow:hidden;
}

.logo img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
}

.logo:empty{
  display:none;
}

.content{
  padding:95px 70px 70px;
}

.main-grid{
  display:grid;
  grid-template-columns:150px 150px 1fr;
  gap:22px;
  min-height:230px;
}

.main-app,
.app{
  background:rgba(0,0,0,.45);
  border-radius:12px;
  text-align:center;
  padding:14px 8px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.main-app img{
  width:82px;
  height:82px;
  object-fit:contain;
  margin-bottom:8px;
}

.app img{
  width:62px;
  height:62px;
  object-fit:contain;
  margin-bottom:6px;
}

.app-name{
  font-size:15px;
  color:#fff;
  word-break:break-word;
}

.banner{
  background:rgba(0,0,0,.55);
  border-radius:12px;
  overflow:hidden;
  min-height:230px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-banner{
  color:#fff;
  font-weight:bold;
  opacity:.85;
}

.secondary{
  margin-top:26px;
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:18px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  background:rgba(0,0,0,.75);
  display:flex;
  justify-content:center;
  gap:28px;
  align-items:center;
  font-size:28px;
}

.status{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:40px;
}

.status-box{
  width:70%;
  max-width:980px;
  min-height:230px;
  background:#45515A;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  font-size:19px;
  font-weight:bold;
  line-height:1.5;
}

@media(max-width:900px){
  .secondary{grid-template-columns:repeat(4,1fr)}
  .main-grid{grid-template-columns:130px 130px 1fr}
}
</style>
</head>

<body>

<div id="bg" class="bg"></div>
<div class="overlay"></div>

<div class="top">
  <div id="date" class="date"></div>
  <div class="icons">
    <span onclick="alert('Configurações')">⚙</span>
    <span onclick="alert('Wi-Fi')">📶</span>
    <span onclick="mostrarCodigo()">🎧</span>
  </div>
</div>

<div id="logo" class="logo"></div>

<div class="content" id="content">
  <div class="status">
    <div class="status-box">Carregando launcher...</div>
  </div>
</div>

<div class="bottom">
  <span>🏠</span>
  <span>📦</span>
  <span>⬆️</span>
</div>

<script>
const API = window.location.origin;
const params = new URLSearchParams(window.location.search);
const DEVICE_CODE = params.get('code') || '';

function atualizarData(){
  const d = new Date();
  const data = d.toLocaleDateString('pt-BR');
  const hora = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  document.getElementById('date').textContent = data + ' ' + hora;
}

setInterval(atualizarData, 30000);
atualizarData();

function mostrarCodigo(){
  alert('Código do aparelho: ' + DEVICE_CODE);
}

function appIcon(app){
  return app.icon || 'https://cdn-icons-png.flaticon.com/512/1829/1829586.png';
}

function safeText(text){
  return String(text || '').replace(/[<>&"]/g, '');
}

function openApp(url){
  if(url){
    window.location.href = url;
  }
}

function renderStatus(msg){
  document.getElementById('content').innerHTML = `
    <div class="status">
      <div class="status-box">${msg}</div>
    </div>
  `;
}

function render(data){
  if(!data || !data.layout){
    renderStatus('Dispositivo não registrado. Entre no suporte para registrar.<br><br>Código: ' + DEVICE_CODE);
    return;
  }

  if(!data.active && !data.activated){
    renderStatus('Dispositivo aguardando ativação.<br><br>Código: ' + DEVICE_CODE);
    return;
  }

  const layout = data.layout || {};
  const mainApps = Array.isArray(data.mainApps) ? data.mainApps.slice(0,2) : [];
  const secondaryApps = Array.isArray(data.secondaryApps) ? data.secondaryApps : [];

  const bannerUrl =
    (Array.isArray(layout.banners) && layout.banners.length && (layout.banners[0].image || layout.banners[0].url || layout.banners[0])) ||
    layout.banner ||
    layout.background ||
    '';

  if(layout.background){
    document.getElementById('bg').style.backgroundImage = `url('${layout.background}')`;
  }

  if(layout.logo){
    document.getElementById('logo').innerHTML = `<img src="${layout.logo}" onerror="this.style.display='none'">`;
  }

  const mainHtml = mainApps.map(app=>`
    <div class="main-app" onclick="openApp('${app.apk || app.url || ''}')">
      <img src="${appIcon(app)}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1829/1829586.png'">
      <div class="app-name">${safeText(app.name || 'APP')}</div>
    </div>
  `).join('');

  const emptyMain = `
    <div class="main-app">
      <img src="https://cdn-icons-png.flaticon.com/512/1829/1829586.png">
      <div class="app-name">Sem app</div>
    </div>
  `;

  const bannerHtml = `
    <div class="banner">
      ${
        bannerUrl
        ? `<img src="${bannerUrl}" onerror="this.parentNode.innerHTML='<div class=&quot;no-banner&quot;>Banner/Fundo indisponível</div>'">`
        : `<div class="no-banner">Nenhum banner configurado</div>`
      }
    </div>
  `;

  const secondaryHtml = secondaryApps.map(app=>`
    <div class="app" onclick="openApp('${app.apk || app.url || ''}')">
      <img src="${appIcon(app)}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1829/1829586.png'">
      <div class="app-name">${safeText(app.name || 'APP')}</div>
    </div>
  `).join('');

  document.getElementById('content').innerHTML = `
    <div class="main-grid">
      ${mainHtml || emptyMain + emptyMain}
      ${bannerHtml}
    </div>

    <div class="secondary">
      ${secondaryHtml}
    </div>
  `;
}

async function load(){
  if(!DEVICE_CODE){
    renderStatus('Código do aparelho não encontrado.');
    return;
  }

  try{
    const res = await fetch(API + '/launcher/device/' + DEVICE_CODE, {cache:'no-store'});
    const data = await res.json();
    render(data);
  }catch(e){
    renderStatus('Erro ao conectar no servidor.<br><br>Código: ' + DEVICE_CODE);
  }
}

load();
</script>

</body>
</html>
