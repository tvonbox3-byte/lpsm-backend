<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launcher</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial;
  background:#eee;
  color:#fff;
  overflow:hidden;
}

.bg{
  position:fixed;
  inset:0;
  background:#eee;
  background-size:cover;
  background-position:center;
  z-index:-1;
}

.top{
  display:flex;
  justify-content:space-between;
  padding:35px 70px 0;
  align-items:center;
}

.date{
  color:#00d6c8;
  font-size:24px;
  font-weight:bold;
}

.icons{
  display:flex;
  gap:18px;
  font-size:36px;
}

.content{
  padding:120px 70px 70px;
}

.main-area{
  display:flex;
  gap:22px;
  align-items:stretch;
}

.main-apps{
  display:flex;
  gap:22px;
}

.main-app{
  width:150px;
  height:230px;
  background:rgba(0,0,0,.45);
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.main-app img{
  width:80px;
  height:80px;
  object-fit:contain;
  margin-bottom:12px;
}

.banner{
  flex:1;
  min-height:230px;
  background:rgba(255,255,255,.28);
  border-radius:14px;
  overflow:hidden;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.secondary{
  margin-top:25px;
  display:flex;
  gap:18px;
}

.app{
  width:130px;
  height:120px;
  background:rgba(0,0,0,.45);
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.app img{
  width:58px;
  height:58px;
  object-fit:contain;
  margin-bottom:8px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  background:rgba(0,0,0,.70);
  display:flex;
  justify-content:center;
  gap:35px;
  align-items:center;
  font-size:28px;
}

.status{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

.status-box{
  width:70%;
  min-height:230px;
  background:#45515A;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  font-size:19px;
  font-weight:bold;
}
</style>
</head>

<body>

<div id="bg" class="bg"></div>

<div class="top">
  <div id="date" class="date"></div>
  <div class="icons">
    <span>⚙</span>
    <span>📶</span>
    <span onclick="alert('Código: ' + DEVICE_CODE)">🎧</span>
  </div>
</div>

<div class="content" id="content">
  <div class="status">
    <div class="status-box">Carregando...</div>
  </div>
</div>

<div class="bottom">
  <span>🏠</span>
  <span>📦</span>
  <span>⬆️</span>
</div>

<script>
const API = window.location.origin;
const params = new URLSearchParams(window.location.search);
const DEVICE_CODE = params.get('code') || '';

function atualizarData(){
  const d = new Date();
  const data = d.toLocaleDateString('pt-BR');
  const hora = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('date').textContent = data + ' ' + hora;
}

atualizarData();
setInterval(atualizarData,30000);

function icon(app){
  return app.icon || 'https://cdn-icons-png.flaticon.com/512/1829/1829586.png';
}

function abrir(url){
  if(url) window.location.href = url;
}

function render(data){
  if(!data || !data.layout){
    document.getElementById('content').innerHTML =
      '<div class="status"><div class="status-box">Dispositivo não registrado. Entre no suporte para registrar.</div></div>';
    return;
  }

  const layout = data.layout;

  if(layout.background){
    document.getElementById('bg').style.backgroundImage = `url('${layout.background}')`;
  }

  const mainApps = Array.isArray(data.mainApps) ? data.mainApps.slice(0,3) : [];
  const secondaryApps = Array.isArray(data.secondaryApps) ? data.secondaryApps.slice(0,5) : [];

  const banner = layout.banner || layout.background || '';

  const mainHtml = mainApps.map(app => `
    <div class="main-app" onclick="abrir('${app.apk || ''}')">
      <img src="${icon(app)}">
      <div>${app.name || 'APP'}</div>
    </div>
  `).join('');

  const secondaryHtml = secondaryApps.map(app => `
    <div class="app" onclick="abrir('${app.apk || ''}')">
      <img src="${icon(app)}">
      <div>${app.name || 'APP'}</div>
    </div>
  `).join('');

  document.getElementById('content').innerHTML = `
    <div class="main-area">
      ${mainHtml ? `<div class="main-apps">${mainHtml}</div>` : ''}
      <div class="banner">
        ${banner ? `<img src="${banner}">` : ''}
      </div>
    </div>

    ${secondaryHtml ? `<div class="secondary">${secondaryHtml}</div>` : ''}
  `;
}

async function load(){
  const res = await fetch(API + '/launcher/device/' + DEVICE_CODE,{cache:'no-store'});
  const data = await res.json();
  render(data);
}

load();
</script>

</body>
</html>
