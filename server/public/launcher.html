<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Launcher</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:#fff;
}

.bg{
  position:fixed;
  inset:0;
  background-size:cover;
  background-position:center;
  z-index:-1;
}

.top{
  display:flex;
  justify-content:space-between;
  padding:20px 40px;
  align-items:center;
}

.logo img{
  max-height:70px;
}

.content{
  padding:20px 40px;
}

/* GRID PRINCIPAL */
.main-grid{
  display:grid;
  grid-template-columns:150px 150px 1fr;
  gap:20px;
  margin-bottom:30px;
}

.main-app{
  background:rgba(255,255,255,0.1);
  padding:10px;
  border-radius:10px;
  text-align:center;
}

.main-app img{
  width:80px;
  height:80px;
}

/* BANNER */
.banner{
  background:#111;
  border-radius:10px;
  overflow:hidden;
}

.banner img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* APPS BAIXO */
.secondary{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:20px;
}

.app{
  background:rgba(255,255,255,0.1);
  border-radius:10px;
  padding:10px;
  text-align:center;
}

.app img{
  width:60px;
  height:60px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:40px;
  background:#111;
  display:flex;
  justify-content:space-around;
  align-items:center;
}
</style>
</head>

<body>

<div id="bg" class="bg"></div>

<div class="top">
  <div id="logo" class="logo"></div>
  <div>⚙ 📶 🎧</div>
</div>

<div class="content" id="content">
Carregando...
</div>

<div class="bottom">
🏠 📦 ⬆️
</div>

<script>
const API = window.location.origin;
const params = new URLSearchParams(window.location.search);
const DEVICE_CODE = params.get('code');

function appIcon(app){
  return app.icon || 'https://via.placeholder.com/80';
}

function openApp(url){
  if(url) window.location.href = url;
}

function render(data){

  const mainApps = data.mainApps.slice(0,2);
  const banner = data.layout.banner || data.layout.background;

  const mainHtml = mainApps.map(app=>`
    <div class="main-app" onclick="openApp('${app.apk || ''}')">
      <img src="${appIcon(app)}">
      <div>${app.name}</div>
    </div>
  `).join('');

  const bannerHtml = `
    <div class="banner">
      <img src="${banner}">
    </div>
  `;

  const secondaryHtml = data.secondaryApps.map(app=>`
    <div class="app" onclick="openApp('${app.apk || ''}')">
      <img src="${appIcon(app)}">
      <div>${app.name}</div>
    </div>
  `).join('');

  document.getElementById('content').innerHTML = `
    <div class="main-grid">
      ${mainHtml}
      ${bannerHtml}
    </div>

    <div class="secondary">
      ${secondaryHtml}
    </div>
  `;
}

async function load(){

  const res = await fetch(API + '/launcher/device/' + DEVICE_CODE);
  const data = await res.json();

  if(data.layout.background){
    document.getElementById('bg').style.backgroundImage = `url('${data.layout.background}')`;
  }

  if(data.layout.logo){
    document.getElementById('logo').innerHTML = `<img src="${data.layout.logo}">`;
  }

  render(data);
}

load();
</script>

</body>
</html>
