<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar aplicativo</title>

<style>
body{margin:0;font-family:Arial;background:#081727;color:#fff}
.topbar{height:64px;background:#287df3;display:flex;align-items:center;justify-content:center;position:sticky;top:0}
.back{position:absolute;left:18px;font-size:42px;cursor:pointer}
.btn{width:90%;margin:20px;height:55px;background:#287df3;border:none;color:#fff;font-size:18px;cursor:pointer}
.upload-box{margin:20px;height:200px;border:1px dashed #3a4c66;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>

<body>

<div class="topbar">
<div class="back" onclick="location.href='apps.html'">‹</div>
Adicionar aplicativo
</div>

<input type="file" id="file" hidden accept=".apk">
<div class="upload-box" onclick="document.getElementById('file').click()">
<div id="fileText">Clique para escolher APK</div>
</div>

<div style="padding:20px">
<input id="appName" placeholder="Nome" style="width:100%;height:45px;margin-bottom:10px">
<input id="appPackage" placeholder="Pacote" style="width:100%;height:45px;margin-bottom:10px">
<input id="appVersion" placeholder="Versão" style="width:100%;height:45px;margin-bottom:10px">
<input id="appIcon" placeholder="URL do ícone" style="width:100%;height:45px;margin-bottom:10px">
</div>

<button class="btn" onclick="enviar()">ENVIAR APK</button>
<button class="btn" onclick="saveApp()">SALVAR</button>

<script>
const API = window.location.origin;

let file = null;
let uploadedApkUrl = '';
let extractedData = {};

document.getElementById('file').addEventListener('change', e=>{
file = e.target.files[0];
document.getElementById('fileText').innerText = file.name;
});

function enviar(){
if(!file){
alert("Escolha um APK");
return;
}

const form = new FormData();
form.append("file", file);

const xhr = new XMLHttpRequest();

xhr.onload = ()=>{
let data;

try{
data = JSON.parse(xhr.responseText);
}catch{
alert("Erro no servidor");
return;
}

if(!data.ok){
alert(data.message);
return;
}

uploadedApkUrl = data.url;
extractedData = data.extracted || {};

document.getElementById('appName').value = extractedData.name || file.name;
document.getElementById('appPackage').value = extractedData.package || '';
document.getElementById('appVersion').value = extractedData.version || '';
document.getElementById('appIcon').value = extractedData.icon || '';

alert("APK enviado com sucesso");
};

xhr.open("POST", API + "/upload/apk");
xhr.send(form);
}

async function saveApp(){
try{

if(!uploadedApkUrl){
alert("Envie o APK primeiro");
return;
}

let iconUrl = document.getElementById('appIcon').value.trim();

// 🔥 CORREÇÃO ÍCONE
if(!iconUrl || iconUrl === ''){
iconUrl = 'https://cdn-icons-png.flaticon.com/512/565/565547.png';
}

if(extractedData.icon){
iconUrl = extractedData.icon;
}

const body = {
name: document.getElementById('appName').value || 'APP',
package: document.getElementById('appPackage').value,
version: document.getElementById('appVersion').value,
icon: iconUrl,
apk: uploadedApkUrl,
active: true
};

const res = await fetch(API + '/apps', {
method:'POST',
headers:{'Content-Type':'application/json'},
body:JSON.stringify(body)
});

const data = await res.json();

if(!res.ok || !data.ok){
alert("Erro ao salvar");
return;
}

alert("Salvo com sucesso");
location.href = "apps.html";

}catch(e){
console.log(e);
alert("Erro ao salvar app");
}
}
</script>

</body>
</html>
