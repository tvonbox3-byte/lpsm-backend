<script>
const API = window.location.origin;
let appsCache = [];
let openedId = null;

function fallbackIcon(name) {
  return 'https://cdn-icons-png.flaticon.com/512/565/565547.png';
}

function normalizeApkUrl(url) {
  if (!url) return '';
  return url.replace('http://localhost:3000', window.location.origin);
}

function renderApps(list) {
  const el = document.getElementById('appsList');

  if (!list.length) {
    el.innerHTML = '<div class="empty">Nenhum aplicativo cadastrado.</div>';
    return;
  }

  el.innerHTML = '';

  list.forEach(app => {
    const isOpen = openedId === app.id;

    const apkUrl = normalizeApkUrl(app.apk);

    el.innerHTML += `
      <div class="app-row" onclick="toggle('${app.id}')">
        <img class="app-icon" src="${app.icon || fallbackIcon(app.name)}">
        <div class="app-name">${app.name}</div>
        <button class="expand">${isOpen ? '⌃' : '⌄'}</button>
      </div>

      <div class="details ${isOpen ? 'show' : ''}">
        Nome: ${app.name}<br>
        Pacote: ${app.package || '-'}<br>
        APK: ${apkUrl || '-'}<br>
        <button class="delete-btn" onclick="deleteApp('${app.id}')">EXCLUIR</button>
      </div>
    `;
  });
}

function toggle(id){
  openedId = openedId === id ? null : id;
  renderApps(appsCache);
}

async function loadApps() {
  try {
    const res = await fetch(API + '/apps');
    const data = await res.json();

    appsCache = Array.isArray(data) ? data : [];
    renderApps(appsCache);

  } catch {
    document.getElementById('appsList').innerHTML =
      '<div class="empty">Erro ao carregar aplicativos.</div>';
  }
}

async function deleteApp(id){
  await fetch(API + '/apps/' + id, { method:'DELETE' });
  loadApps();
}

document.addEventListener('DOMContentLoaded', loadApps);
</script>
