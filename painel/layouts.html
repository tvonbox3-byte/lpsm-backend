<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAUNCHER BOX - Meus Layouts</title>
<link rel="stylesheet" href="css/style.css">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#061426;
  color:#fff;
  padding-bottom:70px;
}

.layouts-page{
  min-height:100vh;
  background:#061426;
  padding-bottom:85px;
}

.topbar{
  height:70px;
  background:#0b1f3a;
}

.layouts-toolbar-space{
  height:15px;
}

.blue-action{
  width:100%;
  height:56px;
  border:none;
  border-radius:4px;
  background:#287df3;
  color:#fff;
  font-size:22px;
  cursor:pointer;
  margin:0 0 28px;
}

.layouts-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  padding:20px 0 20px;
  align-items:center;
}

.small-gray-btn{
  width:96px;
  height:48px;
  border:none;
  border-radius:6px;
  background:#8493aa;
  color:#fff;
  font-weight:700;
  font-size:15px;
  cursor:pointer;
  justify-self:center;
}

.layouts-label{
  padding:0 20px 18px;
  font-size:15px;
  font-weight:700;
}

.layouts-container{
  border-top:1px solid rgba(255,255,255,.08);
}

.layout-row{
  min-height:64px;
  display:flex;
  align-items:center;
  gap:20px;
  padding:0 24px;
  background:#0b1f3a;
  border-bottom:1px solid rgba(255,255,255,.08);
  cursor:pointer;
}

.layout-thumb{
  width:28px;
  height:28px;
  object-fit:cover;
  opacity:.95;
}

.layout-name{
  flex:1;
  font-size:19px;
  color:#fff;
}

.layout-arrow{
  color:#445b7a;
  font-size:30px;
  line-height:1;
}

.layout-panel{
  display:none;
  background:#0b1f3a;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.layout-panel.show{
  display:block;
}

.layout-options{
  padding:28px 0 12px;
}

.option-row{
  min-height:64px;
  display:flex;
  align-items:center;
  padding:0 18px 0 76px;
  gap:22px;
  color:#fff;
  cursor:pointer;
  position:relative;
}

.option-row:hover{
  background:rgba(255,255,255,.03);
}

.option-icon{
  position:absolute;
  left:76px;
  width:42px;
  height:42px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  color:#fff;
}

.option-title{
  margin-left:56px;
  flex:1;
  font-size:18px;
}

.option-current{
  color:#667b99;
  font-size:15px;
  margin-right:12px;
}

.option-arrow{
  color:#445b7a;
  font-size:30px;
  line-height:1;
}

.ico-gray{background:#7d8ca2;}
.ico-blue{background:#287df3;}
.ico-green{background:#32c75a;}
.ico-black{background:#000;}
.ico-purple{background:#6c35d8;}
.ico-orange{background:#ff9700;}
.ico-red{background:#ef4338;}
.ico-white{background:#fff;color:#000;}

.data-title{
  padding:28px 20px 18px;
  color:#a8b9cf;
  font-size:16px;
  text-transform:uppercase;
}

.data-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px 28px;
  padding:0 24px 28px;
}

.data-card{
  background:#0e233f;
  border:1px solid rgba(255,255,255,.06);
  min-height:88px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.data-card.full{
  grid-column:1 / -1;
}

.data-card h3{
  margin:0 0 18px;
  font-size:19px;
  font-weight:800;
}

.data-card div{
  font-size:13px;
  color:#fff;
}

.status{
  margin:18px;
  padding:14px;
  border-radius:8px;
  background:#c93b3b;
  display:none;
}

.status.show{
  display:block;
}

.empty-box{
  margin:18px;
  padding:20px;
  background:#0b1f3a;
  border-radius:8px;
  color:#dce7fb;
}

@media(max-width:800px){
  .data-grid{
    grid-template-columns:1fr;
  }

  .option-row{
    padding-left:20px;
  }

  .option-icon{
    left:20px;
  }

  .option-title{
    font-size:16px;
  }
}
</style>
</head>

<body>

<div id="drawerOverlay" class="drawer-overlay"></div>

<aside id="drawer" class="drawer">
  <div class="drawer-profile">
    <div class="drawer-profile-avatar">
      <img
        id="drawerProfileImage"
        src="https://via.placeholder.com/56x56.png?text=LP"
        alt="Imagem"
        onerror="this.style.display='none'; document.getElementById('drawerProfileFallback').style.display='flex';"
      >
      <div id="drawerProfileFallback" class="drawer-profile-fallback" style="display:none;">LP</div>
    </div>

    <div class="drawer-profile-info">
      <div class="drawer-profile-name" id="drawerUserName">lpzovendas vacaria rs</div>
      <div class="drawer-profile-phone" id="drawerUserPhone">📱 54997146384</div>
    </div>

    <button id="drawerClose" class="drawer-profile-close">×</button>
  </div>

  <div class="drawer-menu">
    <a class="drawer-menu-row" href="launcher.html">
      <div class="drawer-menu-left">
        <div class="drawer-menu-icon">🧩</div>
        <span>Gerenciar launcher</span>
      </div>
      <span class="drawer-menu-arrow">›</span>
    </a>

    <a class="drawer-menu-row" href="devices.html">
      <div class="drawer-menu-left">
        <div class="drawer-menu-icon">📁</div>
        <span>Gerenciar clientes</span>
      </div>
      <span class="drawer-menu-arrow">›</span>
    </a>

    <a class="drawer-menu-row" href="resellers.html">
      <div class="drawer-menu-left">
        <div class="drawer-menu-icon">👥</div>
        <span>Gerenciar revendas</span>
      </div>
      <span class="drawer-menu-arrow">›</span>
    </a>

    <a class="drawer-menu-row" href="configuracoes.html">
      <div class="drawer-menu-left">
        <div class="drawer-menu-icon drawer-menu-icon-dark">⚙</div>
        <span>Configurações</span>
      </div>
      <span class="drawer-menu-arrow">›</span>
    </a>
  </div>
</aside>

<header class="topbar">
  <div class="topbar-left">
    <button id="menuBtn" class="icon-btn">☰</button>
  </div>

  <div class="topbar-center-title">LAUNCHER BOX</div>

  <div class="topbar-right">
    <button class="icon-btn bell-btn">♧</button>
  </div>
</header>

<main class="layouts-page">

  <div class="layouts-toolbar-space"></div>

  <button class="blue-action" onclick="window.location.href='addlayout.html'">
    ADD LAYOUT
  </button>

  <button class="blue-action" onclick="copiarLayout()">
    COPIAR LAYOUT
  </button>

  <div class="layouts-actions">
    <button class="small-gray-btn" onclick="loadLayouts()">EXIBIR</button>
    <button class="small-gray-btn" onclick="buscarLayout()">BUSCAR</button>
  </div>

  <div class="layouts-label">LAYOUTS MEUS:</div>

  <div id="statusBox" class="status"></div>

  <div id="layoutsContainer" class="layouts-container">
    <div class="empty-box">Carregando layouts...</div>
  </div>

</main>

<nav class="bottom-nav-home">
  <a class="bottom-home-item" href="dashboard.html">
    <span class="bottom-home-icon">⌂</span>
  </a>

  <a class="bottom-home-item" href="https://wa.me/" target="_blank">
    <span class="bottom-home-icon">◔</span>
  </a>

  <a class="bottom-home-item" href="devices.html">
    <span class="bottom-home-icon">▭</span>
  </a>

  <a class="bottom-home-item active" href="launcher.html">
    <span class="bottom-home-icon">▦</span>
  </a>

  <a class="bottom-home-item" href="#">
    <span class="bottom-home-icon">↑</span>
  </a>
</nav>

<script>
const API = window.location.origin;

let allLayouts = [];
let openedLayoutId = null;

function showStatus(msg){
  const box = document.getElementById('statusBox');
  box.innerHTML = msg;
  box.classList.add('show');
}

function hideStatus(){
  const box = document.getElementById('statusBox');
  box.innerHTML = '';
  box.classList.remove('show');
}

function safeText(value){
  return String(value || '').replace(/[<>&"]/g, function(c){
    return {
      '<':'&lt;',
      '>':'&gt;',
      '&':'&amp;',
      '"':'&quot;'
    }[c];
  });
}

function imgUrl(layout){
  return layout.logo || layout.background || 'https://cdn-icons-png.flaticon.com/512/1829/1829586.png';
}

function boolText(value){
  if(value === true || value === 'sim' || value === 'SIM' || value === 'true') return 'SIM';
  return 'NÃO';
}

function posText(value){
  if(value === 'center') return 'Centralizado';
  if(value === 'right') return 'Direita';
  if(value === 'left') return 'Esquerda';
  return value || '-';
}

function sizeText(value){
  if(value === 'small') return 'Pequeno';
  if(value === 'large') return 'Grande';
  if(value === 'default') return 'Médio';
  return value || '-';
}

function formatDate(value){
  if(!value) return '-';

  try{
    const d = new Date(value);
    if(isNaN(d.getTime())) return value;

    const dia = String(d.getDate()).padStart(2,'0');
    const mes = String(d.getMonth() + 1).padStart(2,'0');
    const ano = d.getFullYear();
    const hora = String(d.getHours()).padStart(2,'0');
    const min = String(d.getMinutes()).padStart(2,'0');
    const seg = String(d.getSeconds()).padStart(2,'0');

    return `${dia}/${mes}/${ano} - ${hora}:${min}:${seg}`;
  }catch(e){
    return value;
  }
}

function renderLayouts(){
  const container = document.getElementById('layoutsContainer');

  if(!allLayouts.length){
    container.innerHTML = '<div class="empty-box">Nenhum layout encontrado.</div>';
    return;
  }

  container.innerHTML = '';

  allLayouts.forEach(layout => {
    const isOpen = String(openedLayoutId) === String(layout.id);

    container.innerHTML += `
      <div class="layout-row" onclick="toggleLayout('${layout.id}')">
        <img class="layout-thumb" src="${imgUrl(layout)}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/1829/1829586.png'">
        <div class="layout-name">${safeText(layout.name || 'Layout sem nome')}</div>
        <div class="layout-arrow">${isOpen ? '⌃' : '⌄'}</div>
      </div>

      <div class="layout-panel ${isOpen ? 'show' : ''}">
        ${renderLayoutPanel(layout)}
      </div>
    `;
  });
}

function renderLayoutPanel(layout){
  return `
    <div class="layout-options">

      <div class="option-row" onclick="event.stopPropagation(); editarLayout('${layout.id}')">
        <div class="option-icon ico-gray">◎</div>
        <div class="option-title">Editar Layout</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); escolherTema('${layout.id}')">
        <div class="option-icon ico-blue">✽</div>
        <div class="option-title">Escolher Tema</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); escolherApps('${layout.id}')">
        <div class="option-icon ico-green">☁</div>
        <div class="option-title">Escolher aplicativos/links/gavetas</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); escolherBanners('${layout.id}')">
        <div class="option-icon ico-black">▭</div>
        <div class="option-title">Escolher banners</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); alterarNome('${layout.id}')">
        <div class="option-icon ico-purple">↗</div>
        <div class="option-title">Alterar nome do layout</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); appAutoStart('${layout.id}')">
        <div class="option-icon ico-orange">▷</div>
        <div class="option-title">App auto start</div>
        <div class="option-current">Atual: Desativado</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); appForceUpdate('${layout.id}')">
        <div class="option-icon ico-red">⇧</div>
        <div class="option-title">App force update</div>
        <div class="option-current">Atual: Desativado</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); packFundos('${layout.id}')">
        <div class="option-icon ico-black">▧</div>
        <div class="option-title">Pack de planos de fundo</div>
        <div class="option-current">Atual: Desativado</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); alterarIcone('${layout.id}')">
        <div class="option-icon ico-gray">▣</div>
        <div class="option-title">Alterar ícone do layout</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); editarIcones('${layout.id}')">
        <div class="option-icon ico-blue">◎</div>
        <div class="option-title">Editar ícones exibidos</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); verClientes('${layout.id}')">
        <div class="option-icon ico-white">☻</div>
        <div class="option-title">Ver clientes que usam</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); moverClientes('${layout.id}')">
        <div class="option-icon ico-red">♙</div>
        <div class="option-title">Mover clientes para outro layout</div>
        <div class="option-arrow">›</div>
      </div>

      <div class="option-row" onclick="event.stopPropagation(); enviarNotificacao('${layout.id}')">
        <div class="option-icon ico-orange">♧</div>
        <div class="option-title">Enviar notificação para todos clientes que usam</div>
        <div class="option-arrow">›</div>
      </div>

    </div>

    <div class="data-title">DADOS DO LAYOUT:</div>

    <div class="data-grid">
      <div class="data-card">
        <h3>QTD Dispositivos</h3>
        <div>${layout.devicesCount || layout.qtdDispositivos || 0}</div>
      </div>

      <div class="data-card">
        <h3>Última alteração</h3>
        <div>${formatDate(layout.updatedAt || layout.createdAt)}</div>
      </div>

      <div class="data-card">
        <h3>Localização logo</h3>
        <div>${posText(layout.logoPosition)}</div>
      </div>

      <div class="data-card">
        <h3>Exibir Apps</h3>
        <div>${boolText(layout.showAppsButton)}</div>
      </div>

      <div class="data-card full">
        <h3>Botões bloqueados</h3>
        <div>${boolText(layout.buttonsLocked)}</div>
      </div>

      <div class="data-card">
        <h3>Tamanho dos ícones</h3>
        <div>${sizeText(layout.iconSize)}</div>
      </div>

      <div class="data-card">
        <h3>Tamanho data e hora</h3>
        <div>${sizeText(layout.clockSize)}</div>
      </div>

      <div class="data-card full">
        <h3>Tamanho data de expiração</h3>
        <div>${sizeText(layout.expireSize)}</div>
      </div>

      <div class="data-card">
        <h3>Posição Banners</h3>
        <div>${posText(layout.bannerPosition)}</div>
      </div>

      <div class="data-card">
        <h3>Posição Data & Hora</h3>
        <div>${posText(layout.datePosition)}</div>
      </div>

      <div class="data-card">
        <h3>Tempo de troca Banners</h3>
        <div>${layout.bannerInterval || 10} segundos</div>
      </div>

      <div class="data-card">
        <h3>Update automático?</h3>
        <div>${boolText(layout.autoUpdate)}</div>
      </div>
    </div>
  `;
}

function toggleLayout(id){
  openedLayoutId = String(openedLayoutId) === String(id) ? null : id;
  renderLayouts();
}

function editarLayout(id){
  window.location.href = 'layout-editor.html?id=' + encodeURIComponent(id);
}

function escolherTema(id){
  window.location.href = 'layout-editor.html?id=' + encodeURIComponent(id) + '&step=tema';
}

function escolherApps(id){
  window.location.href = 'addlayout.html?id=' + encodeURIComponent(id);
}

function escolherBanners(id){
  alert('Função escolher banners será ligada depois.');
}

function alterarNome(id){
  const layout = allLayouts.find(l => String(l.id) === String(id));
  if(!layout) return;

  const novoNome = prompt('Novo nome do layout:', layout.name || '');

  if(!novoNome) return;

  salvarParcialLayout(id, {
    name: novoNome
  });
}

function appAutoStart(id){
  alert('Função App auto start será ligada depois.');
}

function appForceUpdate(id){
  alert('Função App force update será ligada depois.');
}

function packFundos(id){
  alert('Função pack de planos de fundo será ligada depois.');
}

function alterarIcone(id){
  alert('Função alterar ícone será ligada depois.');
}

function editarIcones(id){
  alert('Função editar ícones exibidos será ligada depois.');
}

function verClientes(id){
  window.location.href = 'devices.html?layoutId=' + encodeURIComponent(id);
}

function moverClientes(id){
  alert('Função mover clientes será ligada depois.');
}

function enviarNotificacao(id){
  alert('Função enviar notificação será ligada depois.');
}

async function salvarParcialLayout(id, body){
  try{
    const res = await fetch(API + '/layouts/' + encodeURIComponent(id), {
      method:'PUT',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify(body)
    });

    const data = await res.json();

    if(!res.ok || !data.ok){
      throw new Error(data.message || 'Erro ao salvar layout');
    }

    await loadLayouts();
    openedLayoutId = id;
    renderLayouts();

  }catch(e){
    showStatus(e.message || 'Erro ao salvar alteração');
  }
}

function copiarLayout(){
  alert('Função copiar layout será ligada depois.');
}

function buscarLayout(){
  const termo = prompt('Digite o nome do layout:');

  if(!termo){
    renderLayouts();
    return;
  }

  const filtrados = allLayouts.filter(layout =>
    String(layout.name || '').toLowerCase().includes(termo.toLowerCase())
  );

  const backup = allLayouts;
  allLayouts = filtrados;
  renderLayouts();
  allLayouts = backup;
}

async function loadLayouts(){
  hideStatus();

  try{
    const res = await fetch(API + '/layouts');
    const data = await res.json();

    if(Array.isArray(data)){
      allLayouts = data;
    }else{
      allLayouts = [];
    }

    renderLayouts();

  }catch(e){
    console.error(e);
    showStatus('Erro ao carregar layouts. Verifique se o servidor está ligado.');
  }
}

function setupDrawer(){
  const drawer = document.getElementById('drawer');
  const overlay = document.getElementById('drawerOverlay');
  const btn = document.getElementById('menuBtn');
  const close = document.getElementById('drawerClose');

  if(btn){
    btn.onclick = function(){
      drawer.classList.add('open');
      overlay.classList.add('show');
    };
  }

  if(close){
    close.onclick = fecharDrawer;
  }

  if(overlay){
    overlay.onclick = fecharDrawer;
  }

  function fecharDrawer(){
    drawer.classList.remove('open');
    overlay.classList.remove('show');
  }
}

document.addEventListener('DOMContentLoaded', function(){
  setupDrawer();
  loadLayouts();
});
</script>

</body>
</html>
