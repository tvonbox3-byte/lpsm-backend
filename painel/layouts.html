<script>
let allLayouts = [];
let openedLayoutId = null;

function showStatus(msg){
  document.getElementById('statusBox').innerHTML = msg;
  document.getElementById('statusBox').classList.add('show');
}

function renderLayouts(){
  const container = document.getElementById('layoutsContainer');

  if(!allLayouts.length){
    container.innerHTML = '<div class="empty-box">Nenhum layout encontrado.</div>';
    return;
  }

  container.innerHTML = '';

  allLayouts.forEach(layout => {
    const isOpen = openedLayoutId === layout.id;

    container.innerHTML += `
      <div class="layout-row" onclick="toggleLayout('${layout.id}')">
        <img class="layout-thumb" src="${layout.logo || layout.background || 'https://cdn-icons-png.flaticon.com/512/1829/1829586.png'}">
        <div class="layout-name">${layout.name}</div>
        <div class="layout-arrow">${isOpen ? '⌃' : '⌄'}</div>
      </div>

      <div class="layout-menu ${isOpen ? 'show' : ''}">
        <div class="menu-item">
          <div class="menu-text">Apps principais: ${layout.mainApps?.length || 0}</div>
        </div>
      </div>
    `;
  });
}

function toggleLayout(id){
  openedLayoutId = openedLayoutId === id ? null : id;
  renderLayouts();
}

async function loadLayouts(){
  try{
    const res = await fetch(window.location.origin + '/layouts');
    const data = await res.json();

    if(Array.isArray(data)){
      allLayouts = data;
    } else {
      allLayouts = [];
    }

    renderLayouts();

  } catch(e){
    console.error(e);
    showStatus('Erro ao carregar layouts (API)');
  }
}

document.addEventListener('DOMContentLoaded', loadLayouts);
</script>
